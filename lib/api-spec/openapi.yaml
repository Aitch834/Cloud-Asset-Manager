components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    TenantSlugHeader:
      name: x-tenant-slug
      in: header
      required: true
      description: Tenant slug to scope the request
      schema:
        type: string
    FarmIdPath:
      name: farmId
      in: path
      required: true
      schema:
        type: integer
    RecordIdPath:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CreateLeadBody:
      type: object
      properties:
        businessName:
          type: string
        contactName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        farmCount:
          type: integer
          minimum: 1
        modulesInterested:
          type: array
          items:
            type: string
        message:
          type: string
      required:
        - businessName
        - contactName
        - email
        - farmCount
        - modulesInterested
    Lead:
      type: object
      properties:
        id:
          type: integer
        businessName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        farmCount:
          type: integer
        modulesInterested:
          type: array
          items:
            type: string
        message:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - businessName
        - contactName
        - email
        - farmCount
        - modulesInterested
        - createdAt
    ChatMessageBody:
      type: object
      properties:
        message:
          type: string
        conversationHistory:
          type: array
          items:
            $ref: "#/components/schemas/ChatHistoryItem"
      required:
        - message
    ChatHistoryItem:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        suggestEscalation:
          type: boolean
      required:
        - reply
        - suggestEscalation
    CreateSupportTicketBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        subject:
          type: string
        description:
          type: string
        conversationHistory:
          type: array
          items:
            $ref: "#/components/schemas/ChatHistoryItem"
      required:
        - name
        - email
        - subject
        - description
    SupportTicket:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        description:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - subject
        - description
        - status
        - createdAt
    SupportTicketMessage:
      type: object
      properties:
        id:
          type: integer
        ticketId:
          type: integer
        senderType:
          type: string
          enum: [admin, customer]
        senderId:
          type: string
          nullable: true
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, ticketId, senderType, message, createdAt]
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Tenant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        isActive:
          type: boolean
        stripeCustomerId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, name, slug, contactEmail, isActive, createdAt]
    TenantEnvelope:
      type: object
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
      required: [tenant]
    CreateTenantBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        address:
          type: string
      required: [name, slug, contactEmail]
    UpdateTenantBody:
      type: object
      properties:
        name:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        address:
          type: string
    UserTenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            type: object
            properties:
              tenantId:
                type: integer
              roleId:
                type: integer
              isSuperAdmin:
                type: boolean
              tenantName:
                type: string
              tenantSlug:
                type: string
            required: [tenantId, roleId, isSuperAdmin, tenantName, tenantSlug]
      required: [tenants]
    Farm:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        address:
          type: ["string", "null"]
        postcode:
          type: ["string", "null"]
        cphNumber:
          type: ["string", "null"]
        gridReference:
          type: ["string", "null"]
        totalAcreage:
          type: ["integer", "null"]
        sectorArable:
          type: boolean
        sectorBeef:
          type: boolean
        sectorDairy:
          type: boolean
        sectorPigs:
          type: boolean
        sectorPoultry:
          type: boolean
        sectorHorticulture:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, tenantId, name, isActive]
    FarmEnvelope:
      type: object
      properties:
        farm:
          $ref: "#/components/schemas/Farm"
      required: [farm]
    FarmListResponse:
      type: object
      properties:
        farms:
          type: array
          items:
            $ref: "#/components/schemas/Farm"
      required: [farms]
    CreateFarmBody:
      type: object
