          type: string
        address:
          type: string
        postcode:
          type: string
        cphNumber:
          type: string
        gridReference:
          type: string
        totalAcreage:
          type: integer
        sectorArable:
          type: boolean
        sectorBeef:
          type: boolean
        sectorDairy:
          type: boolean
        sectorPigs:
          type: boolean
        sectorPoultry:
          type: boolean
        sectorHorticulture:
          type: boolean
