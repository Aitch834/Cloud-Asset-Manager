                  type: string
                  format: date-time
                format:
                  type: string
                  enum: [csv, xero]
              required: [dateRangeStart, dateRangeEnd, format]
      responses:
        "200":
          description: Export data (CSV download for csv/xero formats, JSON for record keeping)
          content:
            text/csv:
              schema:
