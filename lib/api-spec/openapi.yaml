openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BDE Farm Trac API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Registration interest leads
  - name: support
    description: Support chat and tickets
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: tenants
    description: Tenant and farm management
  - name: roles
    description: Roles, modules, and permissions
  - name: billing
    description: Stripe billing and subscriptions
  - name: admin
    description: BDE Super Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Register interest
      description: Submit a registration of interest form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/chat:
    post:
      operationId: supportChat
      tags: [support]
      summary: AI support chat
      description: Send a message to the AI support assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageBody"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/tickets:
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create support ticket
      description: Escalate a chat to a human support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketBody"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /tenants/mine:
    get:
      operationId: getMyTenants
      tags: [tenants]
      summary: List tenants the current user belongs to
      responses:
        "200":
          description: List of user tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTenantsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants:
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/current:
    get:
      operationId: getCurrentTenant
      tags: [tenants]
      summary: Get the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Current tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
    put:
      operationId: updateCurrentTenant
      tags: [tenants]
      summary: Update the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
  /tenants/current/farms:
    get:
      operationId: listFarms
      tags: [tenants]
      summary: List farms for the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Farm list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmListResponse"
    post:
      operationId: createFarm
      tags: [tenants]
      summary: Create a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmBody"
      responses:
        "201":
          description: Farm created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmEnvelope"
  /tenants/current/farms/{farmId}:
    put:
      operationId: updateFarm
      tags: [tenants]
      summary: Update a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - name: farmId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmBody"
      responses:
        "200":
          description: Updated farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmEnvelope"
  /tenants/current/invitations:
    get:
      operationId: listInvitations
      tags: [tenants]
      summary: List invitations for the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
    post:
      operationId: createInvitation
      tags: [tenants]
      summary: Invite a user to the tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationBody"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEnvelope"
  /tenants/current/staff-assignments:
    get:
      operationId: listStaffAssignments
      tags: [tenants]
      summary: List staff farm assignments
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentListResponse"
    post:
      operationId: createStaffAssignment
      tags: [tenants]
      summary: Assign staff to a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffAssignmentBody"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentEnvelope"
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles (system + tenant-scoped)
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a custom role for the tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleBody"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
  /modules:
    get:
      operationId: listModules
      tags: [roles]
      summary: List available compliance modules
      responses:
        "200":
          description: Module list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleListResponse"
  /roles/{roleId}/permissions:
    get:
      operationId: getRolePermissions
      tags: [roles]
      summary: Get permissions for a role
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Permission list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
  /roles/{roleId}/permissions/{moduleId}:
    put:
      operationId: updateRolePermission
      tags: [roles]
      summary: Update permission for a role on a module
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePermissionBody"
      responses:
        "200":
          description: Permission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEnvelope"
        "201":
          description: Permission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEnvelope"
  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe checkout session for module subscriptions
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
  /billing/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [billing]
      summary: List subscriptions for the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionListResponse"
  /billing/webhook:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Stripe webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required:
                  - received
  /admin/tenants:
    get:
      operationId: adminListTenants
      tags: [admin]
      summary: List all tenants (Super Admin only)
      responses:
        "200":
          description: All tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantListResponse"
  /admin/tenants/{tenantId}:
    get:
      operationId: adminGetTenantDetail
      tags: [admin]
      summary: Get tenant detail with farms, subscriptions, users
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantDetailResponse"
  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Get platform-wide statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsResponse"
  /admin/support-tickets:
    get:
      operationId: adminListSupportTickets
      tags: [admin]
      summary: List all support tickets (Super Admin only)
      responses:
        "200":
          description: All support tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportTicket"
                required: [tickets]
  /admin/impersonate:
    post:
      operationId: adminImpersonate
      tags: [admin]
      summary: Begin impersonating a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpersonateBody"
      responses:
        "200":
          description: Impersonation context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonateResponse"
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    TenantSlugHeader:
      name: x-tenant-slug
      in: header
      required: true
      description: Tenant slug to scope the request
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CreateLeadBody:
      type: object
      properties:
        businessName:
          type: string
        contactName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        farmCount:
          type: integer
          minimum: 1
        modulesInterested:
          type: array
          items:
            type: string
        message:
          type: string
      required:
        - businessName
        - contactName
        - email
        - farmCount
        - modulesInterested
    Lead:
      type: object
      properties:
        id:
          type: integer
        businessName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        farmCount:
          type: integer
        modulesInterested:
          type: array
          items:
            type: string
        message:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - businessName
        - contactName
        - email
        - farmCount
        - modulesInterested
        - createdAt
    ChatMessageBody:
      type: object
      properties:
        message:
          type: string
        conversationHistory:
          type: array
          items:
            $ref: "#/components/schemas/ChatHistoryItem"
      required:
        - message
    ChatHistoryItem:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        suggestEscalation:
          type: boolean
      required:
        - reply
        - suggestEscalation
    CreateSupportTicketBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        subject:
          type: string
        description:
          type: string
        conversationHistory:
          type: array
          items:
            $ref: "#/components/schemas/ChatHistoryItem"
      required:
        - name
        - email
        - subject
        - description
    SupportTicket:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        subject:
          type: string
        description:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - subject
        - description
        - status
        - createdAt
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Tenant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        isActive:
          type: boolean
        stripeCustomerId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, name, slug, contactEmail, isActive, createdAt]
    TenantEnvelope:
      type: object
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
      required: [tenant]
    CreateTenantBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        address:
          type: string
      required: [name, slug, contactEmail]
    UpdateTenantBody:
      type: object
      properties:
        name:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        address:
          type: string
    UserTenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            type: object
            properties:
              tenantId:
                type: integer
              roleId:
                type: integer
              isSuperAdmin:
                type: boolean
              tenantName:
                type: string
              tenantSlug:
                type: string
            required: [tenantId, roleId, isSuperAdmin, tenantName, tenantSlug]
      required: [tenants]
    Farm:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        address:
          type: ["string", "null"]
        postcode:
          type: ["string", "null"]
        cphNumber:
          type: ["string", "null"]
        gridReference:
          type: ["string", "null"]
        totalAcreage:
          type: ["integer", "null"]
        sectorArable:
          type: boolean
        sectorBeef:
          type: boolean
        sectorDairy:
          type: boolean
        sectorPigs:
          type: boolean
        sectorPoultry:
          type: boolean
        sectorHorticulture:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, tenantId, name, isActive]
    FarmEnvelope:
      type: object
      properties:
        farm:
          $ref: "#/components/schemas/Farm"
      required: [farm]
    FarmListResponse:
      type: object
      properties:
        farms:
          type: array
          items:
            $ref: "#/components/schemas/Farm"
      required: [farms]
    CreateFarmBody:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        postcode:
          type: string
        cphNumber:
          type: string
        gridReference:
          type: string
        totalAcreage:
          type: integer
        sectorArable:
          type: boolean
        sectorBeef:
          type: boolean
        sectorDairy:
          type: boolean
        sectorPigs:
          type: boolean
        sectorPoultry:
          type: boolean
        sectorHorticulture:
          type: boolean
      required: [name]
    InvitationListResponse:
      type: object
      properties:
        invitations:
          type: array
          items:
            type: object
      required: [invitations]
    CreateInvitationBody:
      type: object
      properties:
        email:
          type: string
          format: email
        roleId:
          type: integer
      required: [email, roleId]
    InvitationEnvelope:
      type: object
      properties:
        invitation:
          type: object
      required: [invitation]
