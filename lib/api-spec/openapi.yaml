openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BDE Farm Trac API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Registration interest leads
  - name: support
    description: Support chat and tickets
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: tenants
    description: Tenant and farm management
  - name: roles
    description: Roles, modules, and permissions
  - name: billing
    description: Stripe billing and subscriptions
  - name: admin
    description: BDE Super Admin operations
  - name: compliance
    description: Red Tractor compliance exports
  - name: dashboard
    description: Farm dashboard overview and compliance
  - name: fields
    description: Field register and crop records
  - name: sprays
    description: Spray applications and products
  - name: soil
    description: Soil testing records
  - name: equipment
    description: Equipment, maintenance, and calibration
  - name: livestock
    description: Herd/flock register, animals, movements, medicine, feed, water
  - name: biosecurity
    description: Visitor log, pest control, cleaning and disinfection
  - name: training
    description: Staff training and competency records
  - name: risk-waste
    description: Risk assessments, COSHH, and waste management
  - name: inspections
    description: Inspection and audit history
  - name: environmental
    description: Environmental features and agri-environment schemes
  - name: haulage
    description: Transport and haulage records
  - name: stock
    description: Suppliers, stock items, and deliveries
  - name: financial
    description: Financial records and exports
  - name: documents
    description: Document management
  - name: weather
    description: Weather stations and readings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Register interest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/chat:
    post:
      operationId: supportChat
      tags: [support]
      summary: AI support chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageBody"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
  /support/tickets:
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketBody"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /tenants/mine:
    get:
      operationId: getMyTenants
      tags: [tenants]
      summary: List tenants the current user belongs to
      responses:
        "200":
          description: List of user tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTenantsResponse"
  /tenants:
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/current:
    get:
      operationId: getCurrentTenant
      tags: [tenants]
      summary: Get the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Current tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
    put:
      operationId: updateCurrentTenant
      tags: [tenants]
      summary: Update the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEnvelope"
  /tenants/current/farms:
    get:
      operationId: listFarms
      tags: [tenants]
      summary: List farms for the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Farm list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmListResponse"
    post:
      operationId: createFarm
      tags: [tenants]
      summary: Create a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmBody"
      responses:
        "201":
          description: Farm created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmEnvelope"
  /tenants/current/farms/{farmId}:
    put:
      operationId: updateFarm
      tags: [tenants]
      summary: Update a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFarmBody"
      responses:
        "200":
          description: Updated farm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmEnvelope"
  /tenants/current/invitations:
    get:
      operationId: listInvitations
      tags: [tenants]
      summary: List invitations for the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationListResponse"
    post:
      operationId: createInvitation
      tags: [tenants]
      summary: Invite a user to the tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationBody"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationEnvelope"
  /tenants/current/staff-assignments:
    get:
      operationId: listStaffAssignments
      tags: [tenants]
      summary: List staff farm assignments
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentListResponse"
    post:
      operationId: createStaffAssignment
      tags: [tenants]
      summary: Assign staff to a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffAssignmentBody"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentEnvelope"
  /tenants/current/users:
    get:
      operationId: listTenantUsers
      tags: [tenants]
      summary: List users in the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUserListResponse"
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a custom role for the tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleBody"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
  /modules:
    get:
      operationId: listModules
      tags: [roles]
      summary: List available compliance modules
      responses:
        "200":
          description: Module list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleListResponse"
  /roles/{roleId}/permissions:
    get:
      operationId: getRolePermissions
      tags: [roles]
      summary: Get permissions for a role
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Permission list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
  /roles/{roleId}/permissions/{moduleId}:
    put:
      operationId: updateRolePermission
      tags: [roles]
      summary: Update permission for a role on a module
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePermissionBody"
      responses:
        "200":
          description: Permission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionEnvelope"
  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe checkout session
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
  /billing/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [billing]
      summary: List subscriptions for the current tenant
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionListResponse"
  /billing/webhook:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Stripe webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                required: [received]
  /admin/tenants:
    get:
      operationId: adminListTenants
      tags: [admin]
      summary: List all tenants
      responses:
        "200":
          description: All tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantListResponse"
  /admin/tenants/{tenantId}:
    get:
      operationId: adminGetTenantDetail
      tags: [admin]
      summary: Get tenant detail
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantDetailResponse"
  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Get platform-wide statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsResponse"
  /admin/support-tickets:
    get:
      operationId: adminListSupportTickets
      tags: [admin]
      summary: List all support tickets
      responses:
        "200":
          description: All support tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportTicket"
                required: [tickets]
  /admin/support-tickets/{ticketId}:
    get:
      operationId: adminGetSupportTicket
      tags: [admin]
      summary: Get support ticket detail with messages
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket with messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: "#/components/schemas/SupportTicket"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportTicketMessage"
                required: [ticket, messages]
        "404":
          description: Ticket not found
  /admin/support-tickets/{ticketId}/reply:
    post:
      operationId: adminReplyToTicket
      tags: [admin]
      summary: Reply to a support ticket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
              required: [message]
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/SupportTicketMessage"
                required: [message]
        "404":
          description: Ticket not found
  /admin/support-tickets/{ticketId}/status:
    patch:
      operationId: adminUpdateTicketStatus
      tags: [admin]
      summary: Update ticket status
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, in_progress, resolved, closed]
              required: [status]
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: "#/components/schemas/SupportTicket"
                required: [ticket]
        "404":
          description: Ticket not found
  /admin/impersonate:
    post:
      operationId: adminImpersonate
      tags: [admin]
      summary: Begin impersonating a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpersonateBody"
      responses:
        "200":
          description: Impersonation context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonateResponse"

  # ─── Dashboard Overview ─────────────────────────────
  /farms/{farmId}/dashboard:
    get:
      operationId: getFarmDashboard
      tags: [dashboard]
      summary: Get farm compliance dashboard overview
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmDashboardResponse"
  /farms/{farmId}/activity:
    get:
      operationId: getFarmActivity
      tags: [dashboard]
      summary: Get recent activity feed for a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeedResponse"

  # ─── Fields ─────────────────────────────────────────
  /farms/{farmId}/fields:
    get:
      operationId: listFields
      tags: [fields]
      summary: List fields for a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      responses:
        "200":
          description: Field list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListResponse"
    post:
      operationId: createField
      tags: [fields]
      summary: Create a field
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Field created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
  /farms/{farmId}/fields/{recordId}:
    get:
      operationId: getField
      tags: [fields]
      summary: Get a field by ID
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
        - $ref: "#/components/parameters/RecordIdPath"
      responses:
        "200":
          description: Field record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
    put:
      operationId: updateField
      tags: [fields]
      summary: Update a field
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
        - $ref: "#/components/parameters/RecordIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
    delete:
      operationId: deleteField
      tags: [fields]
      summary: Delete a field
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
        - $ref: "#/components/parameters/RecordIdPath"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  # ─── Crops ──────────────────────────────────────────
  /farms/{farmId}/crops:
    get:
      operationId: listCrops
      tags: [fields]
      summary: List crops for a farm
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      responses:
        "200":
          description: Crop list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListResponse"
    post:
      operationId: createCrop
      tags: [fields]
      summary: Create a crop record
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Crop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
  /farms/{farmId}/crops/{recordId}:
    put:
      operationId: updateCrop
      tags: [fields]
      summary: Update a crop
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
        - $ref: "#/components/parameters/RecordIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
    delete:
      operationId: deleteCrop
      tags: [fields]
      summary: Delete a crop
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
        - $ref: "#/components/parameters/RecordIdPath"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  # ─── Field-Crop Assignments & Harvests ──────────────
  /farms/{farmId}/field-crops:
    get:
      operationId: listFieldCropAssignments
      tags: [fields]
      summary: List field-crop assignments
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      responses:
        "200":
          description: Assignment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListResponse"
    post:
      operationId: createFieldCropAssignment
      tags: [fields]
      summary: Assign a crop to a field
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created
          content:
