  # ─── Compliance ────────────────────────────────────
  /farms/{farmId}/compliance-export:
    get:
      operationId: getComplianceExport
      tags: [compliance]
      summary: Export Red Tractor compliance data (JSON or CSV)
      description: |
        Generates a comprehensive compliance report aggregating inspections,
        non-conformances, corrective actions, risk assessments, COSHH, waste,
        training, visitors, pest control, and cleaning records. No public Red
        Tractor digital submission API exists; this export provides data in
        formats suitable for manual submission to the Red Tractor portal.
      parameters:
        - $ref: "#/components/parameters/TenantSlugHeader"
        - $ref: "#/components/parameters/FarmIdPath"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Compliance export data
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportDate:
                    type: string
                    format: date-time
                  exportFormat:
                    type: string
                  farm:
                    type: object
                  summary:
                    type: object
            text/csv:
              schema:
                type: string

