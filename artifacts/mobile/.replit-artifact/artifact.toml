kind = "mobile"
previewPath = "/mobile/"
title = "BDE Farm Trac Mobile"
version = "1.0.0"
id = "artifacts/mobile"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
localPort = 18115
name = "expo"
paths = ["/mobile/"]

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"

[services.production]
build = ["pnpm", "--filter", "@workspace/mobile", "run", "build"]
run = ["pnpm", "--filter", "@workspace/mobile", "run", "serve"]
