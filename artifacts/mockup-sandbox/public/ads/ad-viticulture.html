<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<title>BDE Farm Trac — Viticulture Ad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }

  .ad {
    width: 100vw;
    height: 100vh;
    background: #1C1A17;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6vh 7vw;
    position: relative;
    overflow: hidden;
  }

  /* Decorative vine motif — geometric circles suggesting grapes/vines */
  .vine-deco {
    position: absolute;
    right: 5vw;
    top: 50%;
    transform: translateY(-50%);
    width: 30vw;
    height: 80vh;
    opacity: 0.07;
  }

  /* Tan accent line top */
  .accent-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0.6vh;
    background: #C49A6C;
  }

  /* Left green border strip */
  .left-strip {
    position: absolute;
    left: 0; top: 0;
    width: 0.8vw;
    height: 100%;
    background: #2D6A2E;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 1.4vw;
    z-index: 2;
  }
  .logo svg { height: 6.5vh; width: auto; }
  .logo-text {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.05;
  }
  .logo-text .bde { font-size: 3.6vh; letter-spacing: -0.02em; }
  .logo-text .farmtrac { font-size: 2vh; color: #C49A6C; letter-spacing: 0.12em; }

  .middle {
    display: flex;
    flex-direction: column;
    gap: 2.8vh;
    z-index: 2;
    max-width: 65vw;
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 1.2vw;
    color: #C49A6C;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 6.8vw;
    line-height: 1.05;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  .headline em {
    font-style: italic;
    color: #C49A6C;
  }

  .benefit {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 1.7vw;
    color: rgba(255,255,255,0.7);
    line-height: 1.55;
    max-width: 56vw;
  }

  .cta {
    display: inline-block;
    background: transparent;
    color: #C49A6C;
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 1.5vw;
    padding: 1.4vh 3.4vw;
    border-radius: 0.5vw;
    border: 2px solid #C49A6C;
    letter-spacing: 0.04em;
    align-self: flex-start;
    text-decoration: none;
  }

  .footer {
    font-family: 'Inter', sans-serif;
    font-size: 1.2vw;
    color: rgba(255,255,255,0.3);
    z-index: 2;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="accent-line"></div>
  <div class="left-strip"></div>

  <!-- Decorative vine SVG -->
  <svg class="vine-deco" viewBox="0 0 300 600" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Stylised vine stem and grape cluster geometry -->
    <circle cx="150" cy="80" r="60" fill="#C49A6C"/>
    <circle cx="90" cy="150" r="45" fill="#C49A6C"/>
    <circle cx="210" cy="150" r="45" fill="#C49A6C"/>
    <circle cx="60" cy="240" r="35" fill="#C49A6C"/>
    <circle cx="150" cy="220" r="55" fill="#C49A6C"/>
    <circle cx="240" cy="240" r="35" fill="#C49A6C"/>
    <circle cx="100" cy="320" r="40" fill="#C49A6C"/>
    <circle cx="200" cy="320" r="40" fill="#C49A6C"/>
    <circle cx="150" cy="400" r="50" fill="#C49A6C"/>
    <circle cx="80" cy="450" r="30" fill="#C49A6C"/>
    <circle cx="220" cy="450" r="30" fill="#C49A6C"/>
    <circle cx="150" cy="520" r="45" fill="#C49A6C"/>
    <!-- Stem -->
    <rect x="146" y="0" width="8" height="600" rx="4" fill="#2D6A2E"/>
    <!-- Tendrils -->
    <path d="M150 120 Q200 100 220 60" stroke="#2D6A2E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M150 200 Q90 180 70 140" stroke="#2D6A2E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M150 310 Q210 290 230 260" stroke="#2D6A2E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M150 420 Q95 400 75 370" stroke="#2D6A2E" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>

  <!-- Logo -->
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 185" role="img" aria-label="BDE Farm Trac tractor icon">
      <ellipse cx="94" cy="172" rx="86" ry="9" fill="#8B5E3C" opacity="0.3"/>
      <path d="M 12,160 C -2,132 -2,80 10,52 C 22,28 42,22 64,22 L 80,10 L 122,10 L 122,76 L 175,92 L 173,114 L 114,110 L 112,132 Z" fill="#2D6A2E"/>
      <rect x="114" y="109" width="63" height="26" rx="4" fill="#2D6A2E"/>
      <circle cx="62" cy="125" r="47" fill="#1F4F1F"/>
      <circle cx="62" cy="125" r="33" fill="#1C1A17"/>
      <circle cx="62" cy="125" r="15" fill="#C49A6C"/>
      <circle cx="62" cy="125" r="5" fill="#2D6A2E"/>
      <rect x="68" y="10" width="60" height="14" rx="5" fill="#5A8F5A"/>
      <rect x="85" y="24" width="31" height="44" rx="3" fill="#7CB87C" opacity="0.65"/>
      <rect x="110" y="108" width="14" height="20" rx="2" fill="#5A8F5A"/>
      <rect x="117" y="2" width="8" height="70" rx="4" fill="#C49A6C"/>
      <ellipse cx="121" cy="2" rx="4.5" ry="2.5" fill="#8B5E3C"/>
      <rect x="129" y="14" width="6" height="58" rx="3" fill="#C49A6C"/>
      <ellipse cx="132" cy="14" rx="3.5" ry="2" fill="#8B5E3C"/>
      <circle cx="160" cy="147" r="25" fill="#1F4F1F"/>
      <circle cx="160" cy="147" r="17" fill="#1C1A17"/>
      <circle cx="160" cy="147" r="8" fill="#C49A6C"/>
      <circle cx="160" cy="147" r="3" fill="#2D6A2E"/>
    </svg>
    <div class="logo-text">
      <div class="bde">BDE</div>
      <div class="farmtrac">FARM TRAC</div>
    </div>
  </div>

  <!-- Headline + benefit + CTA -->
  <div class="middle">
    <div class="eyebrow">Viticulture compliance · PDO &amp; PGI records · Organic certification</div>
    <div class="headline">Your vineyard.<br><em>Audit-ready.</em></div>
    <div class="benefit">Vine register, phenology, harvest records, spray logs, disease scouting, excise duty — everything your certifier needs, organised and accessible.</div>
    <a class="cta" href="#">Register your interest</a>
  </div>

  <div class="footer">bdefarmtrac.co.uk</div>
</div>
</body>
</html>
